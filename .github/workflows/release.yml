name: Release

on:
  push:
    tags: ["v*"]
  # Para volver a generar una release ya etiquetada (o solo uno de sus
  # binarios) sin mover la etiqueta.
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (p. ej. v0.1.0)"
        required: true
      only:
        description: "Solo este target, «app» para solo los instaladores de la aplicación, o «checksums» (vacío: todo)"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # GitHub retiró los runners Intel de macOS: se compila de forma
          # cruzada desde el de ARM.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.only || inputs.only == matrix.target }}
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.only || inputs.only == matrix.target }}
        with:
          targets: ${{ matrix.target }}
      - if: ${{ !inputs.only || inputs.only == matrix.target }}
        run: cargo build --release --locked -p huella-cli --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows' && (!inputs.only || inputs.only == matrix.target)
        run: |
          name=huella-$TAG-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/huella README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows' && (!inputs.only || inputs.only == matrix.target)
        shell: pwsh
        run: |
          $name = "huella-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name
          Copy-Item target/${{ matrix.target }}/release/huella.exe, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive $name "$name.zip"
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.only || inputs.only == matrix.target }}
        with:
          tag_name: ${{ env.TAG }}
          files: huella-*.*

  # Extensión de VS Code. Nombre fijo: huella setup la descarga de
  # releases/latest/download/huella.vsix.
  vsix:
    if: ${{ !inputs.only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: extensions/vscode
        # vsce no compila por su cuenta (no hay vscode:prepublish): primero build.
        run: |
          npm ci
          npm run build
          npx vsce package --no-dependencies --out ../../huella.vsix
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: huella.vsix

  # La aplicación de escritorio (Tauri) y sus instaladores. Sin firmar: los
  # README explican cómo abrirla la primera vez en macOS y Windows.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.only || inputs.only == 'app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bibliotecas de WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Instaladores
        working-directory: apps/desktop
        shell: bash
        # La versión de los instaladores es la de la etiqueta.
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --config "{\"version\":\"${TAG#v}\"}"
      - name: Subir a la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          bundle=apps/desktop/target/${{ matrix.target }}/release/bundle
          files=("$bundle"/dmg/*.dmg "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb "$bundle"/msi/*.msi "$bundle"/nsis/*.exe)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # Checksums de todos los ficheros de la release: install.sh e install.ps1
  # no instalan nada sin comprobarlos. Se rehace con cada fichero que se añade.
  checksums:
    needs: [build, vsix, app]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
