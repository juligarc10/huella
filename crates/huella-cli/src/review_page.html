<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huella · Revisión</title>
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --quiet: #6b6a64; --line: #e6e3db;
    --accent: #2f5bd3; --on-accent: #ffffff; --ok: #1f7a4d; --warn: #a15c00; --warn-bg: #fff4e0;
    --add-bg: #e9f6ee; --add-ink: #145c37; --del-bg: #fbecec; --del-ink: #8a1f1f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1d1d1b; --ink: #ecebe6; --quiet: #9d9b93; --line: #33322e;
      --accent: #7ea2ff; --on-accent: #10131a; --ok: #5cc48c; --warn: #f0a640; --warn-bg: #3a2a10;
      --add-bg: #15301f; --add-ink: #9be0b5; --del-bg: #3a1a1a; --del-ink: #f2a3a3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 80px; }
  .progress div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }
  .counts { color: var(--quiet); white-space: nowrap; font-size: 13px; }
  header label { color: var(--quiet); font-size: 13px; white-space: nowrap; }
  header button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
                  background: var(--bg); color: var(--ink); cursor: pointer; }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; height: calc(100vh - 49px); }
  nav { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding-bottom: 40px; }
  .turn { padding: 12px 14px 6px; font-weight: 600; font-size: 13px; border-top: 1px solid var(--line); }
  .turn small { display: block; font-weight: 400; color: var(--quiet); }
  .role { padding: 6px 14px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--quiet); }
  .item { display: flex; gap: 8px; align-items: baseline; padding: 4px 14px; cursor: pointer; font-size: 13px; }
  .item:hover { background: var(--bg); }
  .item.current { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--quiet); flex: none; transform: translateY(1px); }
  .item.done .dot { background: var(--ok); border-color: var(--ok); }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
  .item .warn { color: var(--warn); }
  section { overflow-y: auto; padding: 20px 28px 80px; }
  .step-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .step-head h2 { margin: 0; font: 600 18px var(--mono); }
  .where { color: var(--quiet); font-family: var(--mono); font-size: 12px; }
  .actions { display: flex; gap: 8px; margin: 12px 0 16px; flex-wrap: wrap; }
  .actions button, .actions a { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
                                border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; }
  .actions .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .actions .primary.done { background: var(--ok); border-color: var(--ok); }
  .prompt { margin: 0 0 8px; color: var(--quiet); }
  .why { margin: 0 0 8px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; white-space: pre-wrap; }
  .why .who { font-size: 11px; color: var(--quiet); display: block; margin-bottom: 2px; }
  .external { margin: 0 0 8px; padding: 10px 14px; border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 0 6px 6px 0; }
  .calls { margin: 8px 0 14px; font-size: 13px; color: var(--quiet); }
  .calls a { color: var(--accent); cursor: pointer; font-family: var(--mono); font-size: 12px; margin-right: 8px; }
  pre.diff { margin: 0; padding: 8px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
             font: 12.5px/1.55 var(--mono); overflow-x: auto; }
  pre.diff span { display: block; padding: 0 14px; white-space: pre; }
  pre.diff .added { background: var(--add-bg); color: var(--add-ink); }
  pre.diff .removed { background: var(--del-bg); color: var(--del-ink); }
  pre.diff .ext { background: var(--warn-bg); color: var(--warn); }
  .keys { color: var(--quiet); font-size: 12px; margin-top: 18px; }
  kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
  .empty { color: var(--quiet); padding: 40px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    nav { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    section { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Huella · Revisión</h1>
  <div class="progress"><div id="bar"></div></div>
  <span class="counts" id="counts"></span>
  <label><input type="checkbox" id="pending"> Solo pendientes</label>
  <button id="export" title="Copia un resumen en markdown de la revisión">Copiar resumen</button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="detail"><p class="empty">Cargando la revisión…</p></section>
</main>
<script>
const TOKEN = "__TOKEN__";
let data = null;
let current = 0;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const shortDate = (t) => t ? t.slice(0, 10) + " " + t.slice(11, 16) : "";
const roleName = { flow: "Flujo", test: "Tests", other: "Otros cambios" };

async function load() {
  const response = await fetch(`/api/review?t=${TOKEN}`);
  data = await response.json();
  $("title").textContent = `Huella · Revisión de ${data.session.slice(0, 8)}`;
  const firstPending = data.steps.findIndex((s) => !s.reviewed);
  current = firstPending >= 0 ? firstPending : 0;
  render();
}

function visibleSteps() {
  return data.steps.filter((s) => !$("pending").checked || !s.reviewed || s.index === current);
}

function render() {
  renderNav();
  renderDetail();
  const done = data.steps.filter((s) => s.reviewed).length;
  $("bar").style.width = `${data.steps.length ? (100 * done) / data.steps.length : 0}%`;
  $("counts").textContent = `${done} / ${data.steps.length} pasos revisados`;
}

function renderNav() {
  const nav = $("nav");
  nav.replaceChildren();
  let turn, role;
  for (const step of visibleSteps()) {
    if (step.turn !== turn) {
      turn = step.turn; role = undefined;
      const info = turn == null ? null : data.turns[turn];
      const head = el("div", "turn", info ? `Turno ${turn + 1}` : "Sin explicación");
      head.append(el("small", null, info ? `${shortDate(info.started_at)} · ${clip(info.prompt || "", 90)}` : "Terminal, formateadores o a mano"));
      nav.append(head);
    }
    if (step.role !== role) { role = step.role; nav.append(el("div", "role", roleName[role])); }
    const item = el("div", "item" + (step.reviewed ? " done" : "") + (step.index === current ? " current" : ""));
    item.style.paddingLeft = `${14 + Math.min(step.depth, 6) * 12}px`;
    item.append(el("span", "dot"));
    item.append(el("span", "name", step.symbol || basename(step.path)));
    if (step.sources.some((s) => s.kind === "external")) item.append(el("span", "warn", "⚠"));
    item.onclick = () => { current = step.index; render(); };
    nav.append(item);
    if (step.index === current) item.scrollIntoView({ block: "nearest" });
  }
}

function renderDetail() {
  const box = $("detail");
  box.replaceChildren();
  const step = data.steps[current];
  if (!step) { box.append(el("p", "empty", "Esta sesión no tiene cambios que revisar.")); return; }

  const head = el("div", "step-head");
  head.append(el("h2", null, `${current + 1}. ${step.symbol || "(fuera de funciones)"}`));
  head.append(el("span", "where", `${step.display_path}:${step.line} · +${step.added} −${step.removed}`));
  box.append(head);

  const actions = el("div", "actions");
  const mark = el("button", "primary" + (step.reviewed ? " done" : ""), step.reviewed ? "✓ Revisado" : "Marcar revisado (r)");
  mark.onclick = () => toggle(step);
  const open = el("a", null, data.editor === "zed" ? "Abrir en Zed (e)" : "Abrir en VS Code (e)");
  open.href = editorUrl(step);
  const prev = el("button", null, "← Anterior (k)"); prev.onclick = () => move(-1);
  const next = el("button", null, "Siguiente (j) →"); next.onclick = () => move(1);
  actions.append(mark, open, prev, next);
  box.append(actions);

  const turn = step.turn == null ? null : data.turns[step.turn];
  if (turn && turn.prompt) box.append(el("p", "prompt", `Petición: «${clip(turn.prompt, 400)}»`));
  const seen = new Set();
  for (const source of step.sources) {
    if (source.kind === "agent" && source.rationale && !seen.has(source.rationale)) {
      seen.add(source.rationale);
      const why = el("div", "why");
      why.append(el("span", "who", `Explicación del agente · turno ${source.turn + 1} · ${shortDate(source.at)}`));
      why.append(document.createTextNode(source.rationale));
      box.append(why);
    } else if (source.kind === "external" && !seen.has(source.reason)) {
      seen.add(source.reason);
      box.append(el("div", "external", `⚠ ${source.reason}: sin explicación. Las líneas en ámbar no las escribió el agente en una edición registrada.`));
    }
  }

  if (step.calls.length) {
    const calls = el("div", "calls", "Llama a: ");
    for (const target of step.calls) {
      const link = el("a", null, data.steps[target].symbol || basename(data.steps[target].path));
      link.onclick = () => { current = target; render(); };
      calls.append(link);
    }
    box.append(calls);
  }

  const diff = el("pre", "diff");
  for (const line of step.lines) {
    const cls = line.kind === "added" ? (line.external ? "ext" : "added") : line.kind === "removed" ? "removed" : "";
    const sign = line.kind === "added" ? (line.external ? "!" : "+") : line.kind === "removed" ? "-" : " ";
    diff.append(el("span", cls, `${sign} ${line.text}`));
  }
  box.append(diff);
  box.append(Object.assign(el("p", "keys"), { innerHTML: "<kbd>j</kbd>/<kbd>k</kbd> siguiente y anterior · <kbd>r</kbd> marcar revisado y avanzar · <kbd>e</kbd> abrir en el editor · <kbd>u</kbd> solo pendientes" }));
  box.scrollTop = 0;
}

async function toggle(step) {
  step.reviewed = !step.reviewed;
  await fetch(`/api/mark?t=${TOKEN}`, { method: "POST", body: JSON.stringify({ key: step.key, hash: step.hash, reviewed: step.reviewed }) });
  if (step.reviewed) {
    const next = data.steps.findIndex((s, i) => i > current && !s.reviewed);
    if (next >= 0) current = next;
  }
  render();
}

function move(delta) {
  const visible = visibleSteps().map((s) => s.index);
  const position = visible.indexOf(current);
  const target = visible[Math.min(visible.length - 1, Math.max(0, position + delta))];
  if (target != null) { current = target; render(); }
}

function editorUrl(step) {
  const path = encodeURI(step.path);
  return data.editor === "zed" ? `zed://file${path}:${step.line}` : `vscode://file${path}:${step.line}`;
}

function exportMarkdown() {
  const lines = [`# Revisión de la sesión ${data.session.slice(0, 8)}`, ""];
  let turn;
  for (const step of data.steps) {
    if (step.turn !== turn) {
      turn = step.turn;
      const info = turn == null ? null : data.turns[turn];
      lines.push("", info ? `## Turno ${turn + 1}: ${clip(info.prompt || "", 140)}` : "## Cambios sin explicación", "");
    }
    const warn = step.sources.some((s) => s.kind === "external") ? " ⚠ sin explicación" : "";
    lines.push(`- [${step.reviewed ? "x" : " "}] \`${step.symbol || basename(step.path)}\` (${step.display_path}) +${step.added} −${step.removed}${warn}`);
  }
  navigator.clipboard.writeText(lines.join("\n")).then(() => { $("export").textContent = "¡Copiado!"; setTimeout(() => ($("export").textContent = "Copiar resumen"), 1500); });
}

const clip = (text, max) => { const flat = text.replace(/\s+/g, " ").trim(); return flat.length > max ? flat.slice(0, max) + "…" : flat; };
const basename = (path) => path.split("/").pop();

document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.target.tagName === "INPUT") return;
  const step = data && data.steps[current];
  if (event.key === "j") move(1);
  else if (event.key === "k") move(-1);
  else if (event.key === "r" && step) toggle(step);
  else if (event.key === "e" && step) window.location.href = editorUrl(step);
  else if (event.key === "u") { $("pending").checked = !$("pending").checked; render(); }
});
$("pending").onchange = render;
$("export").onclick = exportMarkdown;
load();
</script>
</body>
</html>
