[package]
name = "huella-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
huella-anchoring = { version = "0.1.0", path = "../huella-anchoring" }
huella-claude-code = { version = "0.1.0", path = "../huella-claude-code" }
huella-core = { version = "0.1.0", path = "../huella-core" }
huella-decisions = { version = "0.1.0", path = "../huella-decisions" }
huella-engine = { version = "0.1.0", path = "../huella-engine" }
huella-lsp = { version = "0.1.0", path = "../huella-lsp" }
huella-review = { version = "0.1.0", path = "../huella-review" }
huella-store = { version = "0.1.0", path = "../huella-store" }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[lints]
workspace = true

[[bin]]
name = "huella"
path = "src/main.rs"
