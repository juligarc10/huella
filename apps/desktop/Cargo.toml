[package]
name = "huella-app"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juligarc10/huella"
rust-version = "1.90"
publish = false
description = "Huella como aplicación de escritorio"

# Workspace propio: así compilar la CLI no exige las bibliotecas de WebKit de
# Linux que necesita la aplicación.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
huella-cli = { path = "../../crates/huella-cli" }
tauri = { version = "2", features = ["tray-icon"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
